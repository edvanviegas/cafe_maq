{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="caixa-login card">
  <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" class="logo-grande">
  <h1>Entrar no CafeMaq</h1>
  <p class="suave">Área de donos de fazenda e funcionários.</p>

  <form method="post" class="formulario">
    {{ csrf_campo() }}
    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required>
    </div>
    <button class="botao largo">Entrar</button>
  </form>

  {% include 'auth/google_botao.html' %}

  <p class="rodape-login">Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
</div>
{% endblock %}
